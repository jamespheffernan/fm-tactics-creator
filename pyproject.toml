[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fm-tactics-creator"
version = "0.1.1"
description = "Create native Football Manager tactic variants from an existing .fmf template"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "James Heffernan"}]
dependencies = ["cryptography>=42", "zstandard>=0.25"]

[project.scripts]
fm-tactics = "fm_tactics_creator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/fm-tactics-creator" = ["PROVENANCE.json"]
